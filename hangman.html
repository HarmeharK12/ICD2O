<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hangman</title>
    <link rel="stylesheet" href="web_sprint.css" />
  </head>
  <body>
    <main class="app-shell">
      <nav>
        <a href="/">Back to Main Menu</a>
      </nav>

      <section class="page-header">
        <h1>Hangman</h1>
        <p class="category-label">Category: Technology / Computer Science</p>
      </section>

      <section class="status-panel">
        <div id="status">Guess the word letter by letter!</div>
      </section>

      <section class="hangman-section">
        <div class="hangman-display">
          <svg viewBox="0 0 200 280" id="hangman-svg">
            <!-- Gallows -->
            <line x1="10" y1="270" x2="150" y2="270" stroke="#f4f5fb" stroke-width="4"/>
            <line x1="50" y1="270" x2="50" y2="20" stroke="#f4f5fb" stroke-width="4"/>
            <line x1="50" y1="20" x2="130" y2="20" stroke="#f4f5fb" stroke-width="4"/>
            <line x1="130" y1="20" x2="130" y2="50" stroke="#f4f5fb" stroke-width="4"/>
            
            <!-- Head -->
            <circle id="head" cx="130" cy="70" r="20" stroke="#f4f5fb" stroke-width="4" fill="none" style="display: none;"/>
            
            <!-- Body -->
            <line id="body" x1="130" y1="90" x2="130" y2="150" stroke="#f4f5fb" stroke-width="4" style="display: none;"/>
            
            <!-- Left Arm -->
            <line id="left-arm" x1="130" y1="110" x2="100" y2="130" stroke="#f4f5fb" stroke-width="4" style="display: none;"/>
            
            <!-- Right Arm -->
            <line id="right-arm" x1="130" y1="110" x2="160" y2="130" stroke="#f4f5fb" stroke-width="4" style="display: none;"/>
            
            <!-- Left Leg -->
            <line id="left-leg" x1="130" y1="150" x2="110" y2="190" stroke="#f4f5fb" stroke-width="4" style="display: none;"/>
            
            <!-- Right Leg -->
            <line id="right-leg" x1="130" y1="150" x2="150" y2="190" stroke="#f4f5fb" stroke-width="4" style="display: none;"/>
          </svg>
        </div>

        <div class="word-display">
          <div id="word-blanks" class="word-blanks"></div>
        </div>

        <div class="guesses-info">
          <p>Wrong Guesses: <span id="wrong-count">0</span>/6</p>
          <div id="guessed-letters" class="guessed-letters"></div>
        </div>
      </section>

      <section class="keyboard-section">
        <div id="keyboard" class="keyboard"></div>
      </section>

      <section class="page-actions">
        <button id="reset-btn">New Game</button>
      </section>

      <div id="game-over-overlay" class="game-over-overlay hidden">
        <div class="game-over-message">
          <h2 id="game-over-text"></h2>
          <p id="word-reveal"></p>
        </div>
      </div>
    </main>

    <script src="hangman.js"></script>
  </body>
</html>
