<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Choose a Game</title>
    <link rel="stylesheet" href="Web Sprint/web_sprint.css" />
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f1e3cc;
            color: #2b1f16;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .home-shell {
            width: min(100%, 440px);
            padding: 40px 24px;
            text-align: center;
        }

        h1 {
            margin: 0 0 40px;
            font-size: clamp(2rem, 5vw, 3rem);
            letter-spacing: -0.02em;
        }

        .game-options {
            display: grid;
            gap: 24px;
        }

        .game-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 92px;
            padding: 0 28px;
            border-radius: 999px;
            border: none;
            background: #d6b183;
            color: #2b1f16;
            text-decoration: none;
            font-size: 1.25rem;
            font-weight: 700;
            box-shadow: 0 18px 36px rgba(0, 0, 0, 0.12);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .game-button:hover,
        .game-button:focus-visible {
            transform: translateY(-3px);
            box-shadow: 0 24px 44px rgba(0, 0, 0, 0.16);
            outline: none;
        }
    </style>
</head>
<body>
    <main class="home-shell">
        <h1>Choose a Game</h1>
        <div class="game-options">
            <a class="game-button" href="Web Sprint/web_sprint.html">Tic Tac Toe</a>
            <a class="game-button" href="Web Sprint/hangman.html">Hangman</a>
        </div>
    </main>
</body>
</html>
