<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Choose a Game</title>
    <link rel="stylesheet" href="Web Sprint/web_sprint.css" />
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: flex-start; /* move content toward top */
            justify-content: center;
            padding-top: 8vh; /* bring heading higher */
            background: #f1e3cc;
            color: #2b1f16;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .home-shell {
            width: min(100%, 860px);
            padding: 40px 24px 48px;
            text-align: center;
        }

        h1 {
            margin: 0 0 8px; /* keep heading higher */
            font-size: clamp(2rem, 5vw, 3rem);
            letter-spacing: -0.02em;
        }

        .game-options {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 40px;
            margin-top: 140px; /* move the buttons much lower */
        }

        .game-button {
            display: block;
            text-decoration: none;
            color: inherit;
        }

        @media (max-width: 720px) {
            .game-options {
                grid-template-columns: 1fr;
            }
        }

        .game-card {
            width: 100%;
            min-height: 320px;
            aspect-ratio: 4 / 3;
            border-radius: 36px; /* squircle-like */
            overflow: hidden;
            position: relative;
            box-shadow: 0 18px 36px rgba(0, 0, 0, 0.12);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            background-size: cover;
            background-position: center center;
        }

        .game-card:hover { transform: translateY(-6px); box-shadow: 0 28px 48px rgba(0,0,0,0.18); }

        .game-label {
            width: 100%;
            padding: 18px;
            background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.36) 100%);
            color: #fff;
            font-weight: 800;
            font-size: 1.25rem;
            text-align: center;
            letter-spacing: -0.01em;
        }

        .play-circle {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: rgba(255,255,255,0.94);
            display: grid;
            place-items: center;
            color: #111;
            font-weight: 900;
            font-size: 24px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.18);
        }

        .game-button:hover,
        .game-button:focus-visible {
            transform: translateY(-3px);
            box-shadow: 0 24px 44px rgba(0, 0, 0, 0.16);
            outline: none;
        }
    </style>
</head>
<body>
    <main class="home-shell">
        <h1>Choose a Game</h1>
        <div class="game-options">
            <a class="game-button" href="Web Sprint/web_sprint.html">
                <div class="game-card" style="background-image: url('https://play-lh.googleusercontent.com/FKZpd7mFIZClF1csEiGpuj-XRycBQK2kHRCxdQ_LUnzgKfvj_wBAq4rf4EjYc-xz7yUw');">
                    <div class="game-label">Tic Tac Toe</div>
                    <div class="play-circle">&#9658;</div>
                </div>
            </a>

            <a class="game-button" href="Web Sprint/hangman.html">
                <div class="game-card" style="background-image: url('https://t4.ftcdn.net/jpg/05/17/38/33/360_F_517383341_8nWEFfM1KL3K5LNTjUDrne3x0kZiuxuj.jpg');">
                    <div class="game-label">Hangman</div>
                    <div class="play-circle">&#9658;</div>
                </div>
            </a>
        </div>
    </main>
</body>
</html>
