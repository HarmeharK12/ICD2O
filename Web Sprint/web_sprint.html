<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="web_sprint.css" />
  </head>
  <body>
    <main class="app-shell">
      <nav>
        <a href="/">Back to Main Menu</a>
      </nav>

      <section class="page-header">
        <h1>Tic Tac Toe</h1>
      </section>

      <section class="status-panel">
        <div id="status">You start. Pick a cell to begin.</div>
      </section>

      <section class="coin-section">
        <h2>Coin Toss — Choose Heads or Tails</h2>
        <p class="coin-choice">Pick a side and flip the coin to decide who goes first.</p>

        <div class="coin-buttons">
          <button class="coin-side" data-side="heads" id="choose-heads">Heads</button>
          <button class="coin-side" data-side="tails" id="choose-tails">Tails</button>
          <button class="primary-btn" id="flip-btn">Flip Coin</button>
        </div>

        <div class="coin-animation" id="coin-animation">
          <div class="coin" id="coin">
            <img class="coin-face coin-front" id="coin-front" src="https://i.cbc.ca/ais/1.7028101,1699994423000/full/max/0/default.jpg?im=Crop%2Crect%3D%280%2C0%2C4096%2C4096%29%3B" alt="Heads" />
            <img class="coin-face coin-back" id="coin-back" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS-VYkBVU3DUw6l5SOLHW6bO71Vf8t5hlOzJw&s" alt="Tails" />
          </div>
        </div>

        <div class="coin-result hidden" id="coin-result"></div>
      </section>

      <section class="board-section">
        <div class="grid board" id="board">
          <button class="cell" data-index="0"></button>
          <button class="cell" data-index="1"></button>
          <button class="cell" data-index="2"></button>
          <button class="cell" data-index="3"></button>
          <button class="cell" data-index="4"></button>
          <button class="cell" data-index="5"></button>
          <button class="cell" data-index="6"></button>
          <button class="cell" data-index="7"></button>
          <button class="cell" data-index="8"></button>
        </div>
      </section>

      <section class="page-actions">
        <button id="reset-btn">Restart</button>
      </section>

      <div id="win-overlay" class="win-overlay hidden">
        <div class="confetti-container" id="confetti-container"></div>
        <div class="win-message">
          <h2>YOU WIN</h2>
        </div>
      </div>
    </main>

    <script src="web_sprint.js"></script>
  </body>
</html>
