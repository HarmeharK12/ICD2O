<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="web_sprint.css" />
  </head>
  <body>
    <main class="app-shell">
      <nav>
        <a href="/">Back to Main Menu</a>
      </nav>

      <section class="page-header">
        <h1>Tic Tac Toe</h1>
      </section>

      <section class="status-panel">
        <div id="status">Choose One Player or Two Players to start.</div>

        <div class="mode-panel">
          <button id="one-player-btn" class="mode-btn">One Player</button>
          <button id="two-player-btn" class="mode-btn">Two Players</button>
        </div>

        <div id="coin-options" class="coin-options hidden">
          <div class="coin-choice-label">Player 1, choose Heads or Tails:</div>
          <div class="coin-buttons">
            <button id="heads-btn" class="mode-btn">Heads</button>
            <button id="tails-btn" class="mode-btn">Tails</button>
          </div>
          <button id="flip-btn" class="primary-btn flip-btn">Flip Coin</button>
          <div id="coin-result" class="coin-result"></div>
        </div>

        <p class="hint-text">Use the buttons to choose one-player or two-player mode. In two-player mode, flip a coin to decide who starts.</p>
      </section>

      <section class="board-section">
        <div class="grid board" id="board">
          <button class="cell" data-index="0"></button>
          <button class="cell" data-index="1"></button>
          <button class="cell" data-index="2"></button>
          <button class="cell" data-index="3"></button>
          <button class="cell" data-index="4"></button>
          <button class="cell" data-index="5"></button>
          <button class="cell" data-index="6"></button>
          <button class="cell" data-index="7"></button>
          <button class="cell" data-index="8"></button>
        </div>
      </section>

      <section class="page-actions">
        <button id="reset-btn">Restart</button>
      </section>

      <div id="win-overlay" class="win-overlay hidden">
        <div class="confetti-container" id="confetti-container"></div>
        <div class="win-message">
          <h2>YOU WIN</h2>
        </div>
      </div>
    </main>

    <script src="web_sprint.js"></script>
  </body>
</html>
